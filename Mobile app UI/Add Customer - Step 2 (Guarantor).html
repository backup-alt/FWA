<!-- TopAppBar -->

<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary">

</div>
</div>
<div class="flex-grow h-[2px] bg-primary -mx-2 relative z-0"></div>

<div class="relative">
<input class="h-12 px-4 rounded-lg border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary outline-none bg-surface-lowest text-on-surface font-body-lg text-body-lg transition-all w-full placeholder:text-outline-variant shadow-sm" id="guarantor_name" placeholder="" type="text">
</div>
</div>
