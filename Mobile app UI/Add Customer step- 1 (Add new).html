<!DOCTYPE html><html class="light" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Add Customer - RAM Finance</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#004a77",
                        "primary": "#00355f",
                        "surface-container-low": "#f2f4f6",
                        "on-secondary-container": "#50666d",
                        "secondary-container": "#cce4ec",
                        "surface-tint": "#2d6197",
                        "on-background": "#191c1e",
                        "outline": "#727780",
                        "primary-fixed": "#d2e4ff",
                        "error-container": "#ffdad6",
                        "on-surface": "#191c1e",
                        "secondary": "#4c6269",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#7ec0ff",
                        "tertiary-fixed-dim": "#98cbff",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "on-surface-variant": "#42474f",
                        "secondary-fixed": "#cfe6ee",
                        "secondary-fixed-dim": "#b3cad2",
                        "on-error": "#ffffff",
                        "tertiary-container": "#004e7d",
                        "background": "#f7f9fb",
                        "inverse-primary": "#a0c9ff",
                        "on-secondary-fixed-variant": "#344a51",
                        "tertiary-fixed": "#cfe5ff",
                        "surface": "#f7f9fb",
                        "on-secondary-fixed": "#071e24",
                        "on-primary-container": "#8ebdf9",
                        "surface-container": "#eceef0",
                        "primary-container": "#0f4c81",
                        "surface-container-high": "#e6e8ea",
                        "on-primary-fixed-variant": "#07497d",
                        "on-primary-fixed": "#001c37",
                        "tertiary": "#00365a",
                        "inverse-on-surface": "#eff1f3",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "surface-variant": "#e0e3e5",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#d8dadc",
                        "primary-fixed-dim": "#a0c9ff",
                        "outline-variant": "#c2c7d1",
                        "surface-bright": "#f7f9fb",
                        "on-tertiary-fixed": "#001d33",
                        "inverse-surface": "#2d3133"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "0.25rem",
                        "touch-target": "2.75rem",
                        "gutter": "0.75rem",
                        "stack-md": "0.5rem",
                        "stack-lg": "1rem",
                        "margin-page": "1rem"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Manrope"],
                        "data-mono": ["JetBrains Mono"],
                        "display-sm": ["Manrope"],
                        "headline-sm": ["Manrope"]
                    },
                    "fontSize": {
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "display-sm": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-sm": ["16px", { "lineHeight": "24px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        /* Custom floating label styles */
        .floating-input:focus ~ .floating-label,
        .floating-input:not(:placeholder-shown) ~ .floating-label {
            transform: translateY(-1.1rem) scale(0.85);
            color: #00355f; /* primary */
        }
        .floating-input:not(:placeholder-shown):not(:focus) ~ .floating-label {
            color: #42474f; /* on-surface-variant */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col max-w-md mx-auto md:shadow-xl md:border-x md:border-outline-variant">
<!-- Task-Focused Header (Navigation Shell Suppressed per Semantic Mandate) -->
<header class="bg-surface-container sticky top-0 z-50 flex items-center px-4 h-14 w-full border-b border-outline-variant">
  <div class="flex items-center w-full">
    <button aria-label="Back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:opacity-80">
      <span class="material-symbols-outlined text-on-surface-variant">arrow_back</span>
    </button>
    <h1 class="flex-1 font-headline-sm text-headline-sm text-on-surface text-center pr-10">Add Customer</h1>
    <div class="absolute right-4">
      <button aria-label="Close" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:opacity-80">
        <span class="material-symbols-outlined text-on-surface-variant">close</span>
      </button>
    </div>
  </div>
</header>
<main class="flex-1 overflow-y-auto pb-24">
<!-- Step Indicator -->
<div class="px-margin-page py-stack-lg flex justify-between items-center relative z-0">
<div class="absolute left-8 right-8 top-1/2 h-[1px] bg-surface-container-high -z-10 -translate-y-1/2"></div>
<div class="flex flex-col items-center gap-1 bg-surface px-1">
<div class="w-7 h-7 rounded-full bg-primary text-on-primary text-[12px] font-bold flex items-center justify-center">1</div>
<span class="text-[10px] font-medium text-primary">Customer</span>
</div>
<div class="flex flex-col items-center gap-1 bg-surface px-1">
<div class="w-7 h-7 rounded-full bg-surface-container-high text-on-surface-variant text-[12px] font-bold flex items-center justify-center">2</div>
<span class="text-[10px] font-medium text-on-surface-variant">Guarantor</span>
</div>
<div class="flex flex-col items-center gap-1 bg-surface px-1">
<div class="w-7 h-7 rounded-full bg-surface-container-high text-on-surface-variant text-[12px] font-bold flex items-center justify-center">3</div>
<span class="text-[10px] font-medium text-on-surface-variant text-center leading-none">Vehicle &amp;<br>Finance</span>
</div>
<div class="flex flex-col items-center gap-1 bg-surface px-1">
<div class="w-7 h-7 rounded-full bg-surface-container-high text-on-surface-variant text-[12px] font-bold flex items-center justify-center">4</div>
<span class="text-[10px] font-medium text-on-surface-variant">Cheques</span>
</div>
</div>
<!-- Segmented Control -->
<div class="px-margin-page mb-6">
<div class="bg-surface-container p-1 rounded-lg flex w-full">
<button class="flex-1 py-2 text-center bg-on-primary rounded shadow-sm font-label-md text-label-md text-primary">New Customer</button>
<button class="flex-1 py-2 text-center rounded font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-high transition-colors">Existing Customer</button>
</div>
</div>
<!-- Main Form Card -->
<div class="px-margin-page mb-stack-lg">
<div class="bg-on-primary rounded-xl border border-outline-variant shadow-sm p-margin-page flex flex-col gap-gutter">
<!-- Profile Photo Upload -->
<div class="flex flex-col items-center justify-center py-stack-md mb-2">
<button class="w-20 h-20 rounded-full bg-primary-fixed flex items-center justify-center border-2 border-dashed border-primary relative group overflow-hidden hover:bg-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined text-primary text-[32px] fill">photo_camera</span>
<div class="absolute inset-0 bg-on-surface/10 opacity-0 group-active:opacity-100 transition-opacity"></div>
</button>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-2">Upload Photo</span>
</div>
<!-- Form Fields -->
<div class="relative w-full h-14 bg-surface-container-lowest border border-outline-variant hover:border-outline rounded-lg focus-within:border-primary focus-within:border-2 transition-colors">
<input class="floating-input w-full h-full bg-transparent px-4 pt-4 pb-1 font-body-md text-body-md text-on-surface outline-none border-none focus:ring-0 placeholder-transparent" id="customerName" placeholder="Customer Name *" type="text">
<label class="floating-label absolute left-4 top-4 font-body-md text-body-md text-on-surface-variant transition-all pointer-events-none origin-left" for="customerName">Customer Name *</label>
</div>
<div class="relative w-full h-14 bg-surface-container-lowest border border-outline-variant hover:border-outline rounded-lg focus-within:border-primary focus-within:border-2 transition-colors">
<input class="floating-input w-full h-full bg-transparent px-4 pt-4 pb-1 font-body-md text-body-md text-on-surface outline-none border-none focus:ring-0 placeholder-transparent" id="fileId" placeholder="File ID" type="text">
<label class="floating-label absolute left-4 top-4 font-body-md text-body-md text-on-surface-variant transition-all pointer-events-none origin-left" for="fileId">File ID</label>
</div>
<div class="relative w-full bg-surface-container-lowest border border-outline-variant hover:border-outline rounded-lg focus-within:border-primary focus-within:border-2 transition-colors">
<textarea class="floating-input w-full bg-transparent px-4 pt-6 pb-2 font-body-md text-body-md text-on-surface outline-none border-none focus:ring-0 placeholder-transparent resize-none" id="address" placeholder="Address" rows="2"></textarea>
<label class="floating-label absolute left-4 top-4 font-body-md text-body-md text-on-surface-variant transition-all pointer-events-none origin-left" for="address">Address</label>
</div>
<div class="relative w-full bg-surface-container-lowest border border-outline-variant hover:border-outline rounded-lg focus-within:border-primary focus-within:border-2 transition-colors">
<textarea class="floating-input w-full bg-transparent px-4 pt-6 pb-2 font-body-md text-body-md text-on-surface outline-none border-none focus:ring-0 placeholder-transparent resize-none" id="temporaryAddress" placeholder="Temporary Address" rows="2"></textarea>
<label class="floating-label absolute left-4 top-4 font-body-md text-body-md text-on-surface-variant transition-all pointer-events-none origin-left" for="temporaryAddress">Temporary Address</label>
</div>
<div class="relative w-full h-14 bg-surface-container-lowest border border-outline-variant hover:border-outline rounded-lg focus-within:border-primary focus-within:border-2 transition-colors">
<div class="absolute left-4 top-4 font-body-md text-body-md text-on-surface-variant">$</div>
<input class="floating-input w-full h-full bg-transparent pl-8 pr-4 pt-4 pb-1 font-body-md text-body-md text-on-surface outline-none border-none focus:ring-0 placeholder-transparent" id="salary" inputmode="decimal" placeholder="Monthly Salary" type="number">
<label class="floating-label absolute left-8 top-4 font-body-md text-body-md text-on-surface-variant transition-all pointer-events-none origin-left" for="salary">Monthly Salary</label>
</div>
<div class="relative w-full bg-surface-container-lowest border border-outline-variant hover:border-outline rounded-lg focus-within:border-primary focus-within:border-2 transition-colors">
<select class="w-full h-14 bg-transparent px-4 pt-4 pb-1 font-body-md text-body-md text-on-surface outline-none border-none focus:ring-0 appearance-none cursor-pointer" id="idStatus">
<option selected="" value="select">Select</option>
<option value="verified">Verified</option>
<option value="pending">Pending Verification</option>
<option value="expired">Expired</option>
</select>
<label class="absolute left-4 top-1.5 font-body-sm text-body-sm text-on-surface-variant pointer-events-none text-[10px]" for="idStatus">ID Status</label>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
<div class="relative w-full h-14 bg-surface-container-lowest border border-outline-variant hover:border-outline rounded-lg focus-within:border-primary focus-within:border-2 transition-colors">
<input class="floating-input w-full h-full bg-transparent px-4 pt-4 pb-1 font-body-md text-body-md text-on-surface outline-none border-none focus:ring-0 placeholder-transparent" id="contactNumbers" placeholder="Contact Numbers" type="tel">
<label class="floating-label absolute left-4 top-4 font-body-md text-body-md text-on-surface-variant transition-all pointer-events-none origin-left" for="contactNumbers">Contact Numbers</label>
</div>
<div class="flex justify-start -mt-2">
<button class="font-label-md text-label-md text-primary flex items-center gap-1 hover:text-primary-container transition-colors p-1 -ml-1 rounded active:bg-primary-fixed">
<span class="material-symbols-outlined text-[18px]">add</span>
                        Add another number
                    </button>
</div>
</div>
</div>
</main>
<!-- Bottom Actions Container -->
<div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-surface border-t border-outline-variant p-margin-page pb-safe z-50">
<div class="flex gap-4">
<button class="flex-1 h-touch-target rounded-full border border-primary text-primary font-label-md text-label-md active:bg-primary-fixed transition-colors flex items-center justify-center">
                Cancel
            </button>
<button class="flex-[2] h-touch-target rounded-full bg-primary text-on-primary font-label-md text-label-md active:opacity-80 transition-opacity flex items-center justify-center shadow-sm">
                Next Step
            </button>
</div>
</div>


</body></html>
