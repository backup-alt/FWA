<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col pt-safe pb-safe">
<!-- TopAppBar Semantic Shell: Suppressed for Transactional "Add Customer" Form -->
<main class="flex-1 flex flex-col max-w-[420px] w-full mx-auto pb-32">
<!-- Header -->
<header class="flex items-center justify-between px-margin-page h-14 w-full bg-surface shadow-sm sticky top-0 z-40 shrink-0">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container active:opacity-80 transition-colors text-on-surface">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Add Customer</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Stepper -->
<div class="px-margin-page py-stack-md bg-surface border-b border-surface-variant sticky top-14 z-30 flex justify-between items-center shrink-0">
<div class="flex flex-col items-center flex-1">
<div class="w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-md text-label-md mb-1 z-10">1</div>
<span class="font-label-md text-label-md text-primary">Customer</span>
</div>
<div class="h-[2px] bg-outline-variant flex-1 -mt-5 mx-1 relative z-0"></div>
<div class="flex flex-col items-center flex-1 opacity-50">
<div class="w-6 h-6 rounded-full bg-surface-container-high border border-outline text-on-surface-variant flex items-center justify-center font-label-md text-label-md mb-1 z-10">2</div>
<span class="font-label-md text-label-md text-on-surface-variant">Guarantor</span>
</div>
<div class="h-[2px] bg-surface-container-high flex-1 -mt-5 mx-1 relative z-0"></div>
<div class="flex flex-col items-center flex-1 opacity-50">
<div class="w-6 h-6 rounded-full bg-surface-container-high border border-outline text-on-surface-variant flex items-center justify-center font-label-md text-label-md mb-1 z-10">3</div>
<span class="font-label-md text-label-md text-on-surface-variant">Vehicle</span>
</div>
<div class="h-[2px] bg-surface-container-high flex-1 -mt-5 mx-1 relative z-0"></div>
<div class="flex flex-col items-center flex-1 opacity-50">
<div class="w-6 h-6 rounded-full bg-surface-container-high border border-outline text-on-surface-variant flex items-center justify-center font-label-md text-label-md mb-1 z-10">4</div>
<span class="font-label-md text-label-md text-on-surface-variant">Cheques</span>
</div>
</div>
<div class="p-margin-page flex-1 overflow-y-auto">
<!-- Profile Photo Upload -->
<div class="flex flex-col items-center mb-stack-lg">
<div class="w-24 h-24 rounded-full bg-surface-container border-2 border-dashed border-outline-variant flex flex-col items-center justify-center text-primary cursor-pointer active:scale-95 transition-transform">
<span class="material-symbols-outlined text-display-sm mb-1" style="font-variation-settings: 'FILL' 0;">add_a_photo</span>
<span class="font-label-md text-label-md">Upload</span>
</div>
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-gutter">
<div class="flex flex-col">
<label class="font-label-md text-label-md text-on-surface-variant mb-stack-sm" for="firstName">First Name *</label>
<input class="h-touch-target rounded bg-surface-container-lowest border border-outline-variant px-3 font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none" id="firstName" placeholder="Enter first name" type="text">
</div>
<div class="flex flex-col">
<label class="font-label-md text-label-md text-on-surface-variant mb-stack-sm" for="lastName">Last Name *</label>
<input class="h-touch-target rounded bg-surface-container-lowest border border-outline-variant px-3 font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none" id="lastName" placeholder="Enter last name" type="text">
</div>
<div class="flex flex-col">
<label class="font-label-md text-label-md text-on-surface-variant mb-stack-sm" for="phone">Phone Number *</label>
<input class="h-touch-target rounded bg-surface-container-lowest border border-outline-variant px-3 font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none" id="phone" placeholder="+1 (555) 000-0000" type="tel">
</div>
<div class="flex flex-col">
<label class="font-label-md text-label-md text-on-surface-variant mb-stack-sm" for="idNumber">ID / License Number *</label>
<input class="h-touch-target rounded bg-surface-container-lowest border border-outline-variant px-3 font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none" id="idNumber" placeholder="Enter ID number" type="text">
</div>
<div class="flex flex-col">
<label class="font-label-md text-label-md text-on-surface-variant mb-stack-sm" for="address">Home Address</label>
<textarea class="rounded bg-surface-container-lowest border border-outline-variant p-3 font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-none" id="address" placeholder="Enter full address" rows="3"></textarea>
</div>

<button class="flex-1 h-touch-target rounded border border-outline text-on-surface font-label-md text-label-md flex items-center justify-center hover:bg-surface-container active:bg-surface-container-high transition-colors" type="button">
        Cancel
