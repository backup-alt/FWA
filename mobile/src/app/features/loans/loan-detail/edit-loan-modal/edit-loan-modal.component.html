<ion-header>
  <ion-toolbar>
    <ion-title>Edit Loan</ion-title>
    <ion-buttons slot="end"><ion-button (click)="cancel()"><ion-icon name="close-outline"></ion-icon></ion-button></ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="save()">
    <section class="editor-section">
      <h2>Loan details</h2>
      <div class="grid">
        <ion-input label="Loan / File No." labelPlacement="stacked" fill="outline" formControlName="loanAccountNumber"></ion-input>
        <ion-input label="Loan Amount" labelPlacement="stacked" fill="outline" type="number" inputmode="decimal" formControlName="loanAmount"></ion-input>
        <ion-input label="Installment Period" labelPlacement="stacked" fill="outline" type="number" inputmode="numeric" formControlName="installmentPeriod"></ion-input>
        <ion-select label="Period Unit" labelPlacement="stacked" fill="outline" formControlName="installmentPeriodUnit">
          <ion-select-option value="Days">Days</ion-select-option><ion-select-option value="Weeks">Weeks</ion-select-option><ion-select-option value="Months">Months</ion-select-option>
        </ion-select>
        <ion-input label="Interest Rate (%)" labelPlacement="stacked" fill="outline" type="number" inputmode="decimal" formControlName="interestRate"></ion-input>
        <ion-input label="Sales Done By" labelPlacement="stacked" fill="outline" formControlName="salesDoneBy"></ion-input>
      </div>
    </section>

    <div formArrayName="vehicles">
      <section class="editor-section" *ngFor="let vehicle of vehicles.controls; let index = index" [formGroupName]="index">
        <div class="section-heading">
          <h2>Vehicle {{ index + 1 }}</h2>
          <ion-button *ngIf="vehicles.length > 1" type="button" fill="clear" color="danger" (click)="removeVehicle(index)" aria-label="Delete vehicle">
            <ion-icon name="trash-outline"></ion-icon>
          </ion-button>
        </div>
        <div class="grid">
          <ion-select label="Type" labelPlacement="stacked" fill="outline" formControlName="vehicleType">
            <ion-select-option value="Bike">Bike</ion-select-option><ion-select-option value="Car">Car</ion-select-option><ion-select-option value="Auto">Auto</ion-select-option>
          </ion-select>
          <ion-input label="Reg. No." labelPlacement="stacked" fill="outline" formControlName="regNo"></ion-input>
          <ion-input label="Make" labelPlacement="stacked" fill="outline" formControlName="make"></ion-input>
          <ion-input label="Model" labelPlacement="stacked" fill="outline" formControlName="model"></ion-input>
          <ion-input label="RC Status" labelPlacement="stacked" fill="outline" formControlName="rcStatus"></ion-input>
          <ion-select label="NOC" labelPlacement="stacked" fill="outline" formControlName="noc">
            <ion-select-option value="Received">Received</ion-select-option><ion-select-option value="Not Received">Not Received</ion-select-option><ion-select-option value="NA">NA</ion-select-option>
          </ion-select>
          <ion-select label="Insurance" labelPlacement="stacked" fill="outline" formControlName="insurance">
            <ion-select-option value="Active">Active</ion-select-option><ion-select-option value="Expired">Expired</ion-select-option><ion-select-option value="NA">NA</ion-select-option>
          </ion-select>
          <ion-select label="Key Status" labelPlacement="stacked" fill="outline" formControlName="keyStatus">
            <ion-select-option value="Given">Given</ion-select-option><ion-select-option value="Not Given">Not Given</ion-select-option><ion-select-option value="Original">Original</ion-select-option><ion-select-option value="Duplicate">Duplicate</ion-select-option>
          </ion-select>
        </div>
      </section>
    </div>

    <ion-button type="button" fill="clear" (click)="addVehicle()"><ion-icon name="add-outline" slot="start"></ion-icon>Add Vehicle</ion-button>
  </form>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <div class="footer-actions"><ion-button fill="clear" color="medium" (click)="cancel()">Cancel</ion-button><ion-button (click)="save()" [disabled]="form.invalid || saving"><ion-spinner *ngIf="saving" name="crescent"></ion-spinner><span *ngIf="!saving">Save</span></ion-button></div>
  </ion-toolbar>
</ion-footer>
