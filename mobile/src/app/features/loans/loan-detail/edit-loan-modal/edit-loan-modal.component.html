<form class="vehicle-editor" [formGroup]="form" (ngSubmit)="save()">
  <div class="modal-head"><div><span>LOAN WORKSPACE</span><h2>Edit finance record</h2><p>Update the agreement and every linked vehicle.</p></div><button class="icon-btn" type="button" (click)="cancel()"><span class="material-symbols-rounded">close</span></button></div>
  <div class="vehicle-scroll">
    <section class="loan-form-card"><div class="vehicle-form-head"><span>Loan details</span></div><div class="vehicle-form-grid"><div class="field"><label>Loan / File No.</label><input formControlName="loanAccountNumber"></div><div class="field"><label>Loan Amount</label><input type="number" inputmode="decimal" formControlName="loanAmount"></div><div class="field"><label>Installment Period</label><input type="number" inputmode="numeric" formControlName="installmentPeriod"></div><div class="field"><label>Period Unit</label><select formControlName="installmentPeriodUnit"><option>Days</option><option>Weeks</option><option>Months</option></select></div><div class="field"><label>Interest Rate (%)</label><input type="number" inputmode="decimal" formControlName="interestRate"></div><div class="field"><label>Sales Done By</label><input formControlName="salesDoneBy"></div></div></section>
    <div formArrayName="vehicles">
      <section class="vehicle-form-card" *ngFor="let vehicle of vehicles.controls; let index = index" [formGroupName]="index">
        <div class="vehicle-form-head"><span>Vehicle {{ index + 1 }}</span><button class="delete-vehicle" *ngIf="vehicles.length > 1" type="button" (click)="removeVehicle(index)" [attr.aria-label]="'Delete vehicle '+(index+1)"><span class="material-symbols-rounded">delete</span></button></div>
        <div class="vehicle-form-grid"><div class="field"><label>Type</label><select formControlName="vehicleType"><option>Bike</option><option>Car</option><option>Auto</option></select></div><div class="field"><label>Reg. No.</label><input formControlName="regNo"></div><div class="field"><label>Make</label><input formControlName="make"></div><div class="field"><label>Model</label><input formControlName="model"></div><div class="field"><label>RC Status</label><input formControlName="rcStatus"></div><div class="field"><label>NOC</label><select formControlName="noc"><option>Received</option><option>Not Received</option><option>NA</option></select></div><div class="field"><label>Insurance</label><select formControlName="insurance"><option>Active</option><option>Expired</option><option>Not Expired</option><option>NA</option></select></div><div class="field"><label>Key Status</label><select formControlName="keyStatus"><option>Given</option><option>Not Given</option><option>Original</option><option>Duplicate</option></select></div></div>
      </section>
    </div>
    <button class="add-vehicle" type="button" (click)="addVehicle()"><span class="material-symbols-rounded">add</span>Add another vehicle</button>
  </div>
  <div class="vehicle-footer"><button class="action" type="button" (click)="cancel()">Cancel</button><button class="action primary" type="submit" [disabled]="form.invalid || saving"><ion-spinner *ngIf="saving" name="crescent"></ion-spinner><span *ngIf="!saving">Save</span></button></div>
</form>
