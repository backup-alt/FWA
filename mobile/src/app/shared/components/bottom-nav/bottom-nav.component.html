<nav class="bottom-nav" aria-label="Main navigation">
  <button *ngFor="let tab of tabs" class="nav-item" [class.active]="activeTab === tab.name" (click)="onTabClick(tab)" type="button">
    <span class="active-mark"></span>
    <span class="icon-wrap"><span class="material-symbols-rounded">{{ tab.name === 'dashboard' ? 'space_dashboard' : tab.name === 'customers' ? 'group' : tab.name === 'pending-dues' ? 'receipt_long' : 'monitoring' }}</span></span>
    <span>{{ tab.label }}</span>
  </button>
</nav>
